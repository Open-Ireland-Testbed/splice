[agent]
  interval = "10s"
  flush_interval = "10s"

[global_tags]
  vendor = "adtran"
  device = "teraflex"
  device_host = "192.0.2.92"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "demo-token-2024"
  organization = "gnmi"
  bucket = "gnmi"

[[inputs.gnmi]]
  addresses = ["host.docker.internal:9340"]
  enable_tls = false
  encoding = "json_ietf"
  redial = "10s"

  [[inputs.gnmi.subscription]]
    name = "telemetry"
    path = "/"
    subscription_mode = "sample"
    sample_interval = "10s"
