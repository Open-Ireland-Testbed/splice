site_name: Splice
site_description: Vendor-agnostic gNMI server that bridges NETCONF devices to gNMI clients
site_url: https://splice-gnmi.github.io/

repo_url: https://github.com/Open-Ireland-Testbed/splice
repo_name: Open-Ireland-Testbed/splice
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Getting Started:
      - Home: index.md
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Docker + Grafana: noob_guide.md
  - Concepts:
      - Architecture: architecture.md
  - Guides:
      - CLI Reference: cli.md
      - Querying Telemetry: querying-gnmi.md
      - Writing Config (gNMI Set): writing-config.md
      - Python API: python-api.md
      - MCP Server: mcp.md
      - TUI: tui.md
      - Simulation: simulation.md
      - Performance Monitoring: performance-monitoring.md
      - Finding Paths: path-search.md
      - Observability: observability.md
      - Deployment: deployment.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Configuration: configuration.md
      - API Reference: api.md

exclude_docs: |
  agentic_readiness_plan.md
  tui_roadmap.md
  Dockerfile
  docker-compose.yml
  telegraf.conf
